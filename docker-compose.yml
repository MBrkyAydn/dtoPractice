services:
  postgres:
    image: postgres:16-alpine
    container_name: dtopractice-postgres
    environment:
      POSTGRES_DB: dtoPractice
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-8442}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - practice

  app:
    build: .
    image: dtopractice
    container_name: dtopractice-app
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dtoPractice
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-8442}
    networks:
      - practice

networks:
  practice:
    driver: bridge

volumes:
  postgres_data:
